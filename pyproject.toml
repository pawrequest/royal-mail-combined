[project]
name = "royal-mail-combined"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paw", email = "paw@pawrequest.com" }
]
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "royal-mail-address",
    "royal-mail-click-and-drop",
    "royal-mail-collection-order-handler",
    "royal-mail-delivery-office-finder",
    "royal-mail-order",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
royal-mail-address = { path = "../royal-mail-address", editable = true }
royal-mail-click-and-drop = { path = "../royal-mail-click-and-drop", editable = true }
royal-mail-collection-order-handler = { path = "../royal-mail-collection-order-handler ", editable = true }
royal-mail-delivery-office-finder = { path = "../royal-mail-delivery-office-finder", editable = true }
royal-mail-order = { path = "../royal-mail-order", editable = true }